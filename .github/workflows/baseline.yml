name: Elixir Baseline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Fetch dependencies
        working-directory: elixir
        run: mix deps.get
      - name: Run tests
        working-directory: elixir
        run: mix test
      - name: Build escript and verify rename
        working-directory: elixir
        run: |
          mix build
          test -x bin/duet-symphony
          test ! -e bin/symphony
